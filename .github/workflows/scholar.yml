name: Google Scholar stats

# Daily fetch of the citation count shown as a badge on /cv/.
# Results go to the orphan branch google-scholar-stats, so main (the Pages
# source) is never rebuilt by this job. If Scholar blocks the request the job
# fails without touching the branch, and the badge keeps the last good value.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch citation count
        run: |
          mkdir out
          python3 - <<'EOF'
          import json, re, sys, urllib.request
          url = "https://scholar.google.com/citations?user=ooVdh_kAAAAJ&hl=en"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          })
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          # stats table: citations (all, since), h-index (all, since), i10 (all, since)
          cells = [int(x) for x in re.findall(r'<td class="gsc_rsb_std">(\d+)</td>', html)]
          if len(cells) < 6:
              sys.exit("could not parse the Scholar profile (blocked or layout changed)")
          stats = {"citations": cells[0], "h_index": cells[2], "i10_index": cells[4]}
          json.dump(stats, open("out/gs_data.json", "w"))
          json.dump({"schemaVersion": 1, "label": "Citations", "message": str(cells[0]),
                     "namedLogo": "googlescholar", "color": "b6073f", "cacheSeconds": 3600},
                    open("out/gs_data_shieldsio.json", "w"))
          print(stats)
          EOF
      - name: Publish to google-scholar-stats
        run: |
          cd out
          git init -q -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Update Google Scholar stats"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" google-scholar-stats
