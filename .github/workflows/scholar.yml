name: Google Scholar stats

# Daily fetch of the citation count shown as a badge on /cv/.
# Scholar blocks GitHub's runner IPs, so the profile is read through SerpAPI
# (key in the SERPAPI_KEY repo secret; one search per run, well inside the
# free quota). Results go to the orphan branch google-scholar-stats, so main
# (the Pages source) is never rebuilt by this job. If the request fails the job
# fails without touching the branch, and the badge keeps the last good value.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch citation count
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          mkdir out
          python3 - <<'EOF'
          import json, os, sys, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"engine": "google_scholar_author", "author_id": "ooVdh_kAAAAJ",
                                          "hl": "en", "num": 1, "api_key": os.environ["SERPAPI_KEY"]})
          data = json.load(urllib.request.urlopen("https://serpapi.com/search.json?" + query, timeout=60))
          # cited_by.table: [{citations: {all, ...}}, {h_index: {...}}, {i10_index: {...}}]
          table = {k: v["all"] for row in (data.get("cited_by") or {}).get("table", []) for k, v in row.items()}
          if not isinstance(table.get("citations"), int):
              sys.exit(f"no citation count in the SerpAPI response: {data.get('error')}")
          stats = {"citations": table["citations"], "h_index": table.get("h_index"),
                   "i10_index": table.get("i10_index")}
          json.dump(stats, open("out/gs_data.json", "w"))
          json.dump({"schemaVersion": 1, "label": "Citations", "message": str(stats["citations"]),
                     "namedLogo": "googlescholar", "color": "b6073f", "cacheSeconds": 3600},
                    open("out/gs_data_shieldsio.json", "w"))
          print(stats)
          EOF
      - name: Publish to google-scholar-stats
        run: |
          cd out
          git init -q -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Update Google Scholar stats"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" google-scholar-stats
