{%- if site.giscus.category_id and page.comments != false -%}
<!-- Comments (giscus): each post's thread is a GitHub Discussion in site.giscus.repo, matched by the page path -->
<section class="post-comments" style="margin-top: 3em; padding-top: 1.5em; border-top: 1px solid #eee;">
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="light"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
{%- endif -%}
